# 晓记 · Nginx 反代配置
# 放置: /etc/nginx/sites-available/xiaoji
# 前提: certbot/acme.sh 已签发证书，路径按实际调整

# 登录/注册限速区：10 次/10 秒/IP，与后端 strict 限流策略形成双层防护
# 注意：limit_req_zone 只能声明在 http 块，此处 sites-available 会被 http 块 include，
#       故可安全放在 server 块之前。
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

server {
    listen 80;
    server_name 你的域名.com;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 你的域名.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 静态资源缓存（哈希文件名，可长缓存）
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 与页面：都由 .NET 托管（同源，无跨域问题）
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 口述解析是长调用（DeepSeek 最坏 60s+），放宽代理超时
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 简单防刷口径（可选）：对登录接口限速到 Nginx 层
    location /api/auth/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        limit_req zone=login burst=5 nodelay;
    }
}